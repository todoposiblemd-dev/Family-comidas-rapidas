<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Demo Caja Simple - Family Comidas Rápidas</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: #12181F;
    color: #F4F1E8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #app {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .demo-tag {
    background: #FF8C3B;
    color: #3A2308;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    padding: 5px;
    letter-spacing: .3px;
  }
  header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid #22303C;
  }
  header .biz { font-size: 13px; color: #8FA0AC; margin: 0 0 2px; }
  header .total-row { display: flex; align-items: baseline; justify-content: space-between; }
  header .total-label { font-size: 13px; color: #8FA0AC; }
  header .total-amt { font-size: 30px; font-weight: 700; color: #6FE3B4; }

  .tabs { display: flex; gap: 8px; padding: 12px 16px 0; }
  .tab {
    flex: 1;
    padding: 14px 8px;
    text-align: center;
    font-size: 16px;
    font-weight: 700;
    border-radius: 12px;
    border: 2px solid transparent;
    background: #1B2530;
    color: #8FA0AC;
  }
  .tab.active.sell { background: #3A2A16; color: #FFB067; border-color: #FF8C3B; }
  .tab.active.spend { background: #3A1B20; color: #FF9AA8; border-color: #FF5C72; }

  .toolrow { display: flex; gap: 8px; padding: 12px 16px 0; }
  .tool-btn {
    flex: 1;
    padding: 9px 6px;
    border-radius: 10px;
    border: 1px dashed #3A4854;
    background: transparent;
    color: #8FA0AC;
    font-size: 12.5px;
    font-weight: 600;
  }

  main { flex: 1; padding: 10px 16px 170px; overflow-y: auto; }

  .cat-label {
    font-size: 12px;
    color: #6C7C88;
    margin: 18px 0 8px;
    padding-left: 2px;
  }
  .cat-label:first-child { margin-top: 4px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .prod {
    background: #1B2530;
    border: 1px solid #253440;
    border-radius: 14px;
    padding: 12px 10px;
    text-align: left;
    color: #F4F1E8;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-height: 78px;
  }
  .prod:active { background: #253340; }
  .prod .ic { font-size: 22px; }
  .prod .nm { font-size: 14px; font-weight: 600; line-height: 1.2; }
  .prod .pr { font-size: 13px; color: #6FE3B4; font-weight: 700; }
  .prod.agotado { opacity: .38; background: #171F27; }
  .prod.agotado .pr::after { content: ' · agotado'; color: #8B5A5A; }

  .other-btn {
    margin-top: 18px;
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: 1px dashed #3A4854;
    background: transparent;
    color: #8FA0AC;
    font-size: 15px;
    font-weight: 600;
  }

  /* Cuenta en construcción */
  .sticky-footer {
    position: sticky; bottom: 0;
    max-width: 430px; margin: 0 auto; width: 100%;
    background: #161D25;
    max-height: 48vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .ticket-bar {
    display: none;
    background: #1B2530;
    border-top: 1px solid #2B3945;
    border-bottom: 1px solid #2B3945;
    padding: 12px 16px;
  }
  .ticket-bar.show { display: block; }
  .cart-expand-list {
    display: none;
    max-height: 180px;
    overflow-y: auto;
    margin-bottom: 10px;
    border-bottom: 1px solid #2B3945;
  }
  .cart-expand-list.show { display: block; }
  .cart-expand-line {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0;
  }
  .cart-expand-line .left { font-size: 13.5px; }
  .cart-expand-line .sub { color: #6C7C88; font-size: 11.5px; }
  .cart-expand-line .amt-x { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
  .ticket-row { display: flex; justify-content: space-between; align-items: center; }
  .ticket-summary { font-size: 14px; color: #C9D3DB; }
  .ticket-total { font-size: 17px; font-weight: 700; color: #6FE3B4; }
  .ticket-actions { display: flex; gap: 8px; margin-top: 10px; }
  .ticket-view-btn {
    flex: 1; padding: 11px; border-radius: 10px; border: 1px solid #2B3945;
    background: transparent; color: #8FA0AC; font-size: 13.5px; font-weight: 600;
  }
  .cobrar-btn {
    flex: 1.4; padding: 11px; border-radius: 10px; border: none;
    background: #6FE3B4; color: #0B3324; font-size: 14.5px; font-weight: 700;
  }

  /* Gasto */
  .spend-view { display: flex; flex-direction: column; align-items: center; padding-top: 6px; }
  .amount-display {
    font-size: 42px;
    font-weight: 700;
    color: #FF9AA8;
    margin: 10px 0 18px;
    min-height: 52px;
  }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 300px; }
  .key {
    padding: 18px 0;
    font-size: 20px;
    font-weight: 700;
    border-radius: 14px;
    background: #1B2530;
    border: 1px solid #253440;
    color: #F4F1E8;
  }
  .key:active { background: #253340; }
  .spend-desc {
    width: 100%; max-width: 300px;
    margin-top: 16px;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #253440;
    background: #1B2530;
    color: #F4F1E8;
    font-size: 15px;
  }
  .spend-desc::placeholder { color: #5C6C78; }
  .spend-submit {
    width: 100%; max-width: 300px;
    margin-top: 16px;
    padding: 16px;
    border-radius: 14px;
    border: none;
    background: #FF5C72;
    color: #3A0F16;
    font-size: 17px;
    font-weight: 700;
  }

  /* Overlay cantidad */
  .overlay {
    position: absolute; inset: 0;
    background: rgba(10,14,18,0.72);
    display: none;
    align-items: flex-end;
    z-index: 20;
  }
  .overlay.show { display: flex; }
  .sheet {
    width: 100%;
    background: #1B2530;
    border-radius: 20px 20px 0 0;
    padding: 22px 20px 26px;
  }
  .sheet .p-name { font-size: 19px; font-weight: 700; margin-bottom: 2px; }
  .sheet .p-price { font-size: 15px; color: #6FE3B4; margin-bottom: 18px; }
  .qty-row { display: flex; align-items: center; justify-content: center; gap: 22px; margin-bottom: 20px; }
  .qty-btn {
    width: 52px; height: 52px; border-radius: 50%;
    background: #253340; border: none; color: #F4F1E8;
    font-size: 26px; font-weight: 700;
  }
  .qty-val { font-size: 30px; font-weight: 700; min-width: 40px; text-align: center; }
  .sheet-total { text-align: center; font-size: 15px; color: #8FA0AC; margin-bottom: 16px; }
  .sheet-total b { color: #F4F1E8; font-size: 18px; }
  .sheet-actions { display: flex; gap: 10px; }
  .sheet-btn {
    flex: 1; padding: 15px; border-radius: 14px; border: none;
    font-size: 16px; font-weight: 700;
  }
  .sheet-cancel { background: #253340; color: #8FA0AC; }
  .sheet-add { background: #FF8C3B; color: #3A2308; }

  /* Sugerencia de bebida */
  .drink-nudge {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: #1E2A22;
    border-bottom: 1px solid #2B3945;
    overflow: hidden;
  }
  .drink-nudge.show { display: flex; }
  .drink-nudge .dn-label { font-size: 12.5px; color: #9FCBA8; white-space: nowrap; }
  .dn-row { display: flex; gap: 6px; overflow-x: auto; flex: 1; }
  .dn-chip {
    flex: 0 0 auto;
    background: #253340; border: 1px solid #2E3E4A; border-radius: 20px;
    padding: 7px 12px; color: #F4F1E8; font-size: 12.5px; font-weight: 600;
    white-space: nowrap;
  }
  .dn-x {
    flex: 0 0 auto;
    background: none; border: none; color: #6C7C88; font-size: 15px;
    width: 26px; height: 26px;
  }

  /* Historial + barra inferior */
  .bottombar {
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    display: flex; gap: 10px;
    width: 100%;
  }
  .undo-btn, .hist-btn {
    flex: 1; padding: 12px 4px; border-radius: 12px; border: 1px solid #2B3945;
    background: #1B2530; color: #C9D3DB; font-size: 12.5px; font-weight: 600;
    text-align: center;
  }
  .undo-btn:active, .hist-btn:active { background: #253340; }

  .full-panel {
    position: absolute; inset: 0;
    background: #12181F;
    z-index: 30;
    display: none;
    flex-direction: column;
  }
  .full-panel.show { display: flex; }
  .panel-head {
    padding: 16px; border-bottom: 1px solid #22303C;
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel-head span { font-size: 17px; font-weight: 700; }
  .panel-close { background: none; border: none; color: #8FA0AC; font-size: 15px; font-weight: 600; }
  .panel-body { flex: 1; overflow-y: auto; padding: 8px 16px; }

  .hist-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid #1D2831;
  }
  .hist-item .left { font-size: 14px; }
  .hist-item .time { color: #6C7C88; font-size: 12px; }
  .hist-item .amt { font-weight: 700; font-size: 15px; }
  .amt.sale { color: #6FE3B4; }
  .amt.spend { color: #FF9AA8; }
  .panel-empty { text-align: center; color: #6C7C88; padding: 40px 20px; font-size: 14px; }

  .cart-x {
    background: #2A1A1D; color: #FF9AA8; border: none;
    width: 30px; height: 30px; border-radius: 50%; font-size: 15px; font-weight: 700;
  }

  .agotado-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0; border-bottom: 1px solid #1D2831; font-size: 14.5px;
  }
  .agotado-row label { display: flex; align-items: center; gap: 10px; }
  .agotado-row input { width: 20px; height: 20px; }
  .reset-agotados {
    width: 100%; margin-top: 16px; padding: 13px; border-radius: 12px;
    border: 1px solid #2B3945; background: transparent; color: #8FA0AC;
    font-size: 14px; font-weight: 600;
  }

  .toast {
    position: absolute; left: 50%; bottom: 90px;
    transform: translateX(-50%);
    background: #F4F1E8; color: #12181F;
    padding: 10px 18px; border-radius: 30px;
    font-size: 14px; font-weight: 700;
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
    z-index: 40;
    white-space: nowrap;
    max-width: 90%;
    text-align: center;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <div class="demo-tag">DEMO v8 — para probar, no guarda datos reales</div>
  <header>
    <p class="biz">Family Comidas Rápidas · Nocturno</p>
    <div class="total-row">
      <span class="total-label">Hoy</span>
      <span class="total-amt" id="totalHoy">$0</span>
    </div>
  </header>

  <div class="tabs">
    <button class="tab sell active" id="tabSell" onclick="switchTab('sell')">💰 Vender</button>
    <button class="tab spend" id="tabSpend" onclick="switchTab('spend')">💸 Salió plata</button>
  </div>


  <main id="mainSell">
    <div id="grid"></div>
    <button class="other-btn" onclick="openCustom()">➕ Producto que no está en la lista</button>
  </main>

  <main id="mainSpend" style="display:none;">
    <div class="spend-view">
      <div class="amount-display" id="spendAmt">$0</div>
      <div class="keypad" id="keypad"></div>
      <input class="spend-desc" id="spendDesc" placeholder="¿Qué fue? (opcional) — ej: hielo">
      <button class="spend-submit" onclick="submitSpend()">Registrar gasto</button>
    </div>
  </main>

  <div class="sticky-footer" id="stickyFooter">
    <div class="drink-nudge" id="drinkNudge">
      <span class="dn-label">¿Con algo de tomar?</span>
      <div class="dn-row" id="dnRow"></div>
      <button class="dn-x" onclick="hideDrinkNudge()" aria-label="Cerrar">✕</button>
    </div>
    <div class="ticket-bar" id="ticketBar">
      <div class="cart-expand-list" id="cartExpandList"></div>
      <div class="ticket-row">
        <span class="ticket-summary" id="ticketSummary">0 productos</span>
        <span class="ticket-total" id="ticketTotal">$0</span>
      </div>
      <div class="ticket-actions">
        <button class="ticket-view-btn" id="ticketViewBtn" onclick="toggleCartExpand()">Ver cuenta</button>
        <button class="cobrar-btn" onclick="cobrarCuenta()">Cobrar</button>
      </div>
    </div>
    <div class="bottombar" id="bottomBar">
      <button class="undo-btn" onclick="undoLast()">↩️ Deshacer</button>
      <button class="hist-btn" onclick="openHist()">📋 Historial</button>
      <button class="hist-btn" id="agotadosBtn" onclick="openAgotados()">📦 Agotados</button>
    </div>
  </div>

  <div class="overlay" id="confirmCobroOverlay" onclick="if(event.target===this) closeConfirmCobro()">
    <div class="sheet">
      <div class="p-name">Confirmar cobro</div>
      <div class="p-price" id="confirmCobroText">-</div>
      <div class="sheet-actions" style="margin-top:18px;">
        <button class="sheet-btn sheet-cancel" onclick="closeConfirmCobro()">Cancelar</button>
        <button class="sheet-btn sheet-add" onclick="finalizarCobro()">Sí, cobrar</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="customProductOverlay" onclick="if(event.target===this) closeCustomProduct()">
    <div class="sheet">
      <div class="p-name">Producto que no está en la lista</div>
      <div class="p-price" style="margin-bottom:14px;">Nombre y monto</div>
      <input type="text" id="customName" class="spend-desc" placeholder="¿Qué se vendió? — ej: Torta especial" style="width:100%; margin-bottom:10px;">
      <div class="amount-display" id="customAmtDisplay" style="font-size:30px; color:#FF8C3B; margin:6px 0 12px;">$0</div>
      <div class="keypad" id="customKeypad" style="max-width:none; margin-bottom:14px;"></div>
      <div class="sheet-actions">
        <button class="sheet-btn sheet-cancel" onclick="closeCustomProduct()">Cancelar</button>
        <button class="sheet-btn sheet-add" onclick="confirmCustomProduct()">Agregar</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="qtyOverlay" onclick="if(event.target===this) closeQty()">
    <div class="sheet">
      <div class="p-name" id="sheetName">-</div>
      <div class="p-price" id="sheetPrice">-</div>
      <div class="qty-row">
        <button class="qty-btn" onclick="changeQty(-1)">−</button>
        <div class="qty-val" id="qtyVal">1</div>
        <button class="qty-btn" onclick="changeQty(1)">+</button>
      </div>
      <div class="sheet-total">Total <b id="sheetTotal">$0</b></div>
      <div class="sheet-actions">
        <button class="sheet-btn sheet-cancel" onclick="closeQty()">Cancelar</button>
        <button class="sheet-btn sheet-add" onclick="confirmAddToCart()">Agregar</button>
      </div>
    </div>
  </div>

  <div class="full-panel" id="histPanel">
    <div class="panel-head">
      <span>Historial de hoy</span>
      <button class="panel-close" onclick="closePanel('histPanel')">Cerrar</button>
    </div>
    <div class="panel-body" id="histList"></div>
  </div>

  <div class="full-panel" id="agotadoPanel">
    <div class="panel-head">
      <span>Qué se acabó hoy</span>
      <button class="panel-close" onclick="closePanel('agotadoPanel')">Cerrar</button>
    </div>
    <div class="panel-body" id="agotadoList"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const products = [
  {name:'Salchipapa Personal',price:15000,icon:'🍟',cat:'Salchipapas'},

  {name:'Alitas Pollo x4',price:20000,icon:'🍗',cat:'Pollo'},

const topDrinkNames = ['Agua x600ml','Gaseosa 400ml','Jugo Hit','Cerveza','Pony Malta P'];
const topDrinks = topDrinkNames.map(n => products.find(p => p.name === n));

let history = [];
let cart = [];
let agotados = new Set();
let currentProduct = null;
let currentQty = 1;
let spendDigits = '';

function money(n){ return '$' + Math.round(n).toLocaleString('es-CO'); }

function renderGrid(){
  const grid = document.getElementById('grid');
  let html = '';
  let lastCat = null;
  products.forEach((p, i) => {
    if (p.cat !== lastCat) {
      html += `<div class="cat-label" style="grid-column:1/-1">${p.cat}</div>`;
      lastCat = p.cat;
    }
    const isOut = agotados.has(p.name);
    html += `<button class="prod ${isOut ? 'agotado' : ''}" data-idx="${i}" data-out="${isOut ? '1' : '0'}">
      <span class="ic">${p.icon}</span>
      <span class="nm">${p.name}</span>
      <span class="pr">${money(p.price)}</span>
    </button>`;
  });
  grid.innerHTML = html;
  grid.style.display = 'grid';
  grid.style.gridTemplateColumns = '1fr 1fr';
  grid.style.gap = '10px';
  grid.querySelectorAll('.prod').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.idx, 10);
      if (btn.dataset.out === '1') {
        showToast('😕 No hay ' + products[idx].name + ' hoy');
      } else {
        openQty(idx);
      }
    });
  });
}

function switchTab(tab){
  document.getElementById('tabSell').classList.toggle('active', tab==='sell');
  document.getElementById('tabSpend').classList.toggle('active', tab==='spend');
  document.getElementById('mainSell').style.display = tab==='sell' ? 'block' : 'none';
  document.getElementById('mainSpend').style.display = tab==='spend' ? 'block' : 'none';
  document.getElementById('agotadosBtn').style.display = tab==='sell' ? 'block' : 'none';
}

function openQty(idx){
  hideDrinkNudge();
  currentProduct = products[idx];
  currentQty = 1;
  document.getElementById('sheetName').textContent = currentProduct.icon + ' ' + currentProduct.name;
  document.getElementById('sheetPrice').textContent = money(currentProduct.price) + ' c/u';
  document.getElementById('qtyVal').textContent = currentQty;
  document.getElementById('sheetTotal').innerHTML = 'Total <b>' + money(currentProduct.price) + '</b>';
  document.getElementById('qtyOverlay').classList.add('show');
}
function closeQty(){ document.getElementById('qtyOverlay').classList.remove('show'); }
function changeQty(d){
  currentQty = Math.max(1, currentQty + d);
  document.getElementById('qtyVal').textContent = currentQty;
  document.getElementById('sheetTotal').innerHTML = 'Total <b>' + money(currentProduct.price*currentQty) + '</b>';
}

function addLineToCart(product, qty){
  const existing = cart.find(l => l.name === product.name);
  if (existing) { existing.qty += qty; }
  else { cart.push({ name: product.name, icon: product.icon, price: product.price, cat: product.cat, qty }); }
  updateTicketBar();
}

let dnTimer = null;
function confirmAddToCart(){
  const wasFood = currentProduct.cat !== 'Bebidas';
  addLineToCart(currentProduct, currentQty);
  closeQty();
  showToast('✅ ' + currentProduct.name + ' agregado a la cuenta');
  if (wasFood) { showDrinkNudge(); } else { hideDrinkNudge(); }
}

function showDrinkNudge(){
  document.getElementById('dnRow').innerHTML = topDrinks.map(d => `
    <button class="dn-chip" onclick="addDrinkQuick('${d.name.replace(/'/g,"\\'")}')">${d.icon} ${d.name}</button>
  `).join('');
  document.getElementById('drinkNudge').classList.add('show');
  clearTimeout(dnTimer);
  dnTimer = setTimeout(hideDrinkNudge, 6000);
}
function addDrinkQuick(name){
  const d = products.find(p => p.name === name);
  addLineToCart(d, 1);
  showToast('✅ ' + d.name + ' agregado a la cuenta');
  hideDrinkNudge();
}
function hideDrinkNudge(){
  clearTimeout(dnTimer);
  document.getElementById('drinkNudge').classList.remove('show');
}

let customDigits = '';
function openCustom(){
  customDigits = '';
  document.getElementById('customName').value = '';
  document.getElementById('customAmtDisplay').textContent = '$0';
  if (!document.getElementById('customKeypad').innerHTML) {
    const keys = ['1','2','3','4','5','6','7','8','9','000','0','⌫'];
    document.getElementById('customKeypad').innerHTML = keys.map(k =>
      `<button class="key" onclick="pressCustomKey('${k}')">${k}</button>`
    ).join('');
  }
  document.getElementById('customProductOverlay').classList.add('show');
}
function closeCustomProduct(){
  document.getElementById('customProductOverlay').classList.remove('show');
}
function pressCustomKey(k){
  if (k === '⌫') { customDigits = customDigits.slice(0,-1); }
  else { if (customDigits.length < 9) customDigits += k; }
  document.getElementById('customAmtDisplay').textContent = money(parseInt(customDigits || '0', 10));
}
function confirmCustomProduct(){
  const name = document.getElementById('customName').value.trim();
  const amt = parseInt(customDigits || '0', 10);
  if (!name) { showToast('⚠️ Escribe qué se vendió'); return; }
  if (!amt || amt <= 0) { showToast('⚠️ Ingresa un monto'); return; }
  addLineToCart({ name: '🆕 ' + name, icon: '', price: amt, cat: 'Otros' }, 1);
  showToast('✅ ' + name + ' agregado a la cuenta');
  closeCustomProduct();
}

function updateTicketBar(){
  const bar = document.getElementById('ticketBar');
  const count = cart.reduce((s,l) => s + l.qty, 0);
  const total = cart.reduce((s,l) => s + l.price*l.qty, 0);
  if (count === 0) { bar.classList.remove('show'); return; }
  bar.classList.add('show');
  document.getElementById('ticketSummary').textContent = count + (count===1 ? ' producto' : ' productos');
  document.getElementById('ticketTotal').textContent = money(total);
  if (cartExpanded) renderCartExpand();
}

let cartExpanded = false;

function toggleCartExpand(){
  cartExpanded = !cartExpanded;
  renderCartExpand();
}
function renderCartExpand(){
  const list = document.getElementById('cartExpandList');
  const btn = document.getElementById('ticketViewBtn');
  if (!cartExpanded) {
    list.classList.remove('show');
    btn.textContent = 'Ver cuenta';
    return;
  }
  btn.textContent = 'Ocultar';
  list.classList.add('show');
  if (cart.length === 0) {
    list.innerHTML = '<div class="cart-expand-line"><span class="sub">Sin productos todavía</span></div>';
    return;
  }
  list.innerHTML = cart.map((l,i) => `
    <div class="cart-expand-line">
      <div class="left">
        <div>${l.icon} ${l.name} ${l.qty>1 ? 'x'+l.qty : ''}</div>
        <div class="sub">${money(l.price)} c/u</div>
      </div>
      <div class="amt-x">
        <span>${money(l.price*l.qty)}</span>
        <button class="cart-x" onclick="removeCartLine(${i})">✕</button>
      </div>
    </div>
  `).join('');
}
function removeCartLine(i){
  const removed = cart[i];
  cart.splice(i,1);
  updateTicketBar();
  renderCartExpand();
  showToast('✕ ' + removed.name + ' quitado de la cuenta');
}
function cobrarCuenta(){
  if (cart.length === 0) return;
  const total = cart.reduce((s,l) => s + l.price*l.qty, 0);
  const count = cart.reduce((s,l) => s + l.qty, 0);
  document.getElementById('confirmCobroText').textContent = count + (count===1?' producto':' productos') + ' por ' + money(total);
  document.getElementById('confirmCobroOverlay').classList.add('show');
}
function closeConfirmCobro(){
  document.getElementById('confirmCobroOverlay').classList.remove('show');
}
function finalizarCobro(){
  closeConfirmCobro();
  const total = cart.reduce((s,l) => s + l.price*l.qty, 0);
  const label = cart.map(l => (l.qty>1 ? l.qty+'x ' : '') + l.name).join(', ');
  history.unshift({
    type:'sale',
    label: label,
    amount: total,
    time: new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})
  });
  cart = [];
  cartExpanded = false;
  hideDrinkNudge();
  updateTicketBar();
  renderCartExpand();
  updateTotal();
  showToast('✅ Cuenta cobrada — ' + money(total));
}

function renderKeypad(){
  const keys = ['1','2','3','4','5','6','7','8','9','000','0','⌫'];
  document.getElementById('keypad').innerHTML = keys.map(k =>
    `<button class="key" onclick="pressKey('${k}')">${k}</button>`
  ).join('');
}
function pressKey(k){
  if (k === '⌫') { spendDigits = spendDigits.slice(0,-1); }
  else { if (spendDigits.length < 9) spendDigits += k; }
  const val = parseInt(spendDigits || '0', 10);
  document.getElementById('spendAmt').textContent = money(val);
}
function submitSpend(){
  const amt = parseInt(spendDigits || '0', 10);
  if (!amt || amt <= 0) { showToast('⚠️ Ingresa un monto primero'); return; }
  const desc = document.getElementById('spendDesc').value.trim();
  history.unshift({
    type:'spend',
    label: desc ? '💸 ' + desc : '💸 Gasto',
    amount: amt,
    time: new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})
  });
  spendDigits = '';
  document.getElementById('spendAmt').textContent = '$0';
  document.getElementById('spendDesc').value = '';
  updateTotal();
  showToast('✅ Gasto registrado — ' + money(amt));
}

function undoLast(){
  if (history.length === 0) { showToast('No hay nada que deshacer'); return; }
  const removed = history.shift();
  updateTotal();
  showToast('↩️ Deshecho: ' + (removed.type==='sale' ? 'cuenta de ' + money(removed.amount) : removed.label));
}

function updateTotal(){
  const total = history.reduce((sum,h) => sum + (h.type==='sale' ? h.amount : -h.amount), 0);
  document.getElementById('totalHoy').textContent = money(total);
}

function openHist(){
  const list = document.getElementById('histList');
  if (history.length === 0) {
    list.innerHTML = '<div class="panel-empty">Todavía no hay ventas ni gastos registrados hoy.</div>';
  } else {
    list.innerHTML = history.map(h => `
      <div class="hist-item">
        <div class="left">
          <div>${h.label}</div>
          <div class="time">${h.time}</div>
        </div>
        <div class="amt ${h.type}">${h.type==='sale' ? '+' : '−'} ${money(h.amount)}</div>
      </div>
    `).join('');
  }
  document.getElementById('histPanel').classList.add('show');
}

function openAgotados(){
  const list = document.getElementById('agotadoList');
  list.innerHTML = products.map(p => `
    <div class="agotado-row">
      <label>
        <input type="checkbox" ${agotados.has(p.name) ? 'checked' : ''} onchange="toggleAgotado('${p.name.replace(/'/g,"\\'")}')">
        <span>${p.icon} ${p.name}</span>
      </label>
    </div>
  `).join('') + '<button class="reset-agotados" onclick="resetAgotados()">Reiniciar — ya hay de todo</button>';
  document.getElementById('agotadoPanel').classList.add('show');
}
function toggleAgotado(name){
  if (agotados.has(name)) agotados.delete(name); else agotados.add(name);
  renderGrid();
}
function resetAgotados(){
  agotados.clear();
  renderGrid();
  openAgotados();
  showToast('📦 Todo disponible de nuevo');
}

function closePanel(id){ document.getElementById(id).classList.remove('show'); }

let toastTimer = null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1700);
}

renderGrid();
renderKeypad();
updateTotal();
updateTicketBar();
</script>
</body>
</html>
